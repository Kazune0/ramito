<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para tim hermosaaa</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#fff1a8;
}

.pantalla{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at 50% 45%,#fffef0 0%,#fff1a0 52%,#ffd65b 100%);
    transition:opacity 1s ease,visibility 1s ease;
    z-index:10;
}

.pantalla.oculta{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.instruccion{
    position:absolute;
    top:12%;
    color:#715718;
    font-size:17px;
    font-weight:bold;
    animation:flotar 2s ease-in-out infinite;
}

.caja{
    position:relative;
    width:200px;
    height:155px;
    cursor:pointer;
    animation:entradaCaja 1s ease;
}

.caja-cuerpo{
    position:absolute;
    left:20px;
    bottom:0;
    width:160px;
    height:105px;
    border-radius:8px 8px 17px 17px;
    background:linear-gradient(135deg,#ffe56d,#e6b52a);
    box-shadow:0 20px 35px rgba(92,63,0,.22);
}

.caja-cuerpo:before{
    content:"";
    position:absolute;
    left:71px;
    width:19px;
    height:105px;
    background:#fff3aa;
}

.caja-tapa{
    position:absolute;
    z-index:5;
    left:8px;
    top:34px;
    width:184px;
    height:39px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffe982,#edbd31);
    box-shadow:0 9px 17px rgba(83,56,0,.22);
    transform-origin:bottom center;
    transition:1s cubic-bezier(.2,.8,.2,1);
}

.caja-tapa:before{
    content:"";
    position:absolute;
    left:82px;
    width:19px;
    height:39px;
    background:#fff3aa;
}

.cinta-caja{
    position:absolute;
    z-index:3;
    left:90px;
    top:0;
    width:19px;
    height:155px;
    background:#fff3aa;
}

.lazo-caja{
    position:absolute;
    z-index:7;
    left:74px;
    top:0;
    width:52px;
    height:32px;
    transition:transform 1s ease;
}

.lazo-caja:before,
.lazo-caja:after{
    content:"";
    position:absolute;
    width:34px;
    height:25px;
    background:#ffe98a;
}

.lazo-caja:before{
    border-radius:80% 20% 80% 20%;
    transform:rotate(28deg);
}

.lazo-caja:after{
    left:19px;
    border-radius:20% 80% 20% 80%;
    transform:rotate(-28deg);
}

.caja.abierta .caja-tapa{
    transform:rotateX(115deg) translateY(-18px);
}

.caja.abierta .lazo-caja{
    transform:translateY(-10px);
}

.fondo{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:opacity 1.2s ease;
    background:radial-gradient(circle at 50% 28%,#fffef0 0%,#fff2ad 52%,#ffd967 100%);
}

.fondo.mostrar{
    opacity:1;
    visibility:visible;
}

.contenedor{
    width:min(430px,100vw);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ramo{
    position:relative;
    width:100%;
    text-align:center;
}

svg{
    width:100%;
    height:auto;
    max-height:98vh;
    overflow:visible;
}

.papel-atras{
    opacity:0;
    transform-origin:center bottom;
    animation:aparecerPapel .9s ease .35s forwards;
}

.tallos{
    opacity:0;
    animation:aparecerTallos 1.1s ease .75s forwards;
}

.hojas{
    opacity:0;
    transform-origin:center bottom;
    animation:aparecerHojas 1s ease 1.1s forwards;
}

.flor{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:aparecerFlor .85s cubic-bezier(.15,.8,.3,1.2) var(--d) forwards;
}

.relleno{
    opacity:0;
    animation:aparecerFlor .7s ease var(--d) forwards;
}

.papel-frontal{
    opacity:0;
    transform-origin:center bottom;
    animation:aparecerPapel .9s ease 5.2s forwards;
}

.moño{
    opacity:0;
    transform-origin:center;
    animation:aparecerMono .9s cubic-bezier(.15,.8,.3,1.2) 5.6s forwards;
}

.mensaje{
    position:absolute;
    left:50%;
    bottom:1%;
    width:88%;
    padding:15px 18px 17px;
    transform:translateX(-50%) translateY(30px);
    opacity:0;
    border:2px solid #e4b83d;
    border-radius:22px;
    background:linear-gradient(145deg,#fffdf0,#fff4d0);
    box-shadow:
        0 9px 25px rgba(111,77,8,.2),
        inset 0 0 0 4px rgba(255,255,255,.65);
    color:#674f18;
    font-size:14px;
    line-height:1.4;
    animation:aparecerMensaje 1.2s ease 6.2s forwards;
}

.mensaje:before,
.mensaje:after{
    content:"♥";
    position:absolute;
    color:#e9b62c;
    font-size:15px;
}

.mensaje:before{
    left:9px;
    top:7px;
}

.mensaje:after{
    right:9px;
    top:7px;
}

.mensaje strong{
    display:block;
    margin-bottom:5px;
    color:#805e00;
    font-size:20px;
}

@keyframes entradaCaja{
    from{
        opacity:0;
        transform:scale(.7) translateY(40px);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes flotar{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
}

@keyframes aparecerPapel{
    from{
        opacity:0;
        transform:scaleY(.2) translateY(35px);
    }
    to{
        opacity:1;
        transform:scaleY(1) translateY(0);
    }
}

@keyframes aparecerTallos{
    from{
        opacity:0;
        transform:scaleY(.15);
    }
    to{
        opacity:1;
        transform:scaleY(1);
    }
}

@keyframes aparecerHojas{
    from{
        opacity:0;
        transform:scale(.35);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes aparecerFlor{
    0%{
        opacity:0;
        transform:scale(.1) translateY(35px) rotate(-18deg);
    }
    60%{
        opacity:1;
        transform:scale(1.1) translateY(-5px) rotate(5deg);
    }
    100%{
        opacity:1;
        transform:scale(1) translateY(0) rotate(0);
    }
}

@keyframes aparecerMono{
    from{
        opacity:0;
        transform:scale(.15) rotate(-20deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

@keyframes aparecerMensaje{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(30px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0) scale(1);
    }
}
</style>
